name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: app
        run: pnpm typecheck

      - name: Test routing suite
        working-directory: app
        run: pnpm --filter dsh-routing-suite test

      - name: Build shell
        working-directory: app
        run: pnpm build
