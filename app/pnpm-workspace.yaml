packages:
  - 'runtime'
  - 'plugins/*'
  - 'plugins/fork/*'

# electron-builder@26 的传递依赖 @electron/rebuild@3.7.0 用 git 地址声明 @electron/node-gyp，
# pnpm 11 默认拦截"exotic"（git）子依赖；这里覆盖为 npm 正式版本即可正常解析。
overrides:
  '@electron/node-gyp': 10.2.0-electron.2

# pnpm 11 会对发布不足 24h 的版本做拦截；这里放行 DSH 生态的 rc 包与我们要预装的插件。
# 清单沿用 dsh-web-ui 官方的 rc 依赖列表，另补三个插件包。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh@0.1.0-rc.6'
  - '@deepseek-ai/dsh-agent@0.1.0-rc.6'
  - '@deepseek-ai/dsh-agent-default-model@0.1.0-rc.6'
  - '@deepseek-ai/dsh-api-remotes@0.1.0-rc.6'
  - '@deepseek-ai/dsh-attachment@0.1.0-rc.6'
  - '@deepseek-ai/dsh-brand@0.1.0-rc.6'
  - '@deepseek-ai/dsh-client-connection@0.1.0-rc.6'
  - '@deepseek-ai/dsh-client-locale@0.1.0-rc.6'
  - '@deepseek-ai/dsh-client-runtime@0.1.0-rc.6'
  - '@deepseek-ai/dsh-client-ui-conversation@0.1.0-rc.6'
