  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  cloudflared: true
  cpu-features: true
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
  ssh2: true

