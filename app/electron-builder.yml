appId: com.dsh.desktop
productName: DSH Desktop
copyright: Copyright © 2026 DSH Desktop

directories:
  output: release

files:
  - .build/**/*
  - package.json
  - "!node_modules/**/*"

extraResources:
  # 内置 dsh 运行时闭包 + 精选插件，整体随包分发（位于 app.asar 之外，子进程按普通文件读取）。
  # .runtime/ 由 pnpm deploy 物化（hoisted 平铺，peer 解析正确）。
  - from: .runtime/node_modules
    to: dsh-runtime/node_modules
    # source map 与 PDB 只用于开发调试，运行时不读取；排除它们可显著减少
    # Release 下载量，同时保留完整 DSH 核心、官方 UI、插件和原生运行库。
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/*.pdb'

asar: true
npmRebuild: false
# 保持标准压缩；实际体积优化来自排除运行时不读取的调试文件。
compression: normal
artifactName: dsh-desktop-${version}-${os}-${arch}.${ext}

electronLanguages:
  - zh-CN
  - zh_CN
  - en-US
  - en

win:
  # 本仓库暂未配置代码签名证书；关掉签名与可执行文件编辑，也避免 winCodeSign
  # 在无管理员/开发者模式的 Windows 上解压符号链接失败（正式发布时再开启）。
  signAndEditExecutable: false
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  # 未配置 Apple Developer 证书时生成可下载的未签名包；发布机通过环境变量
  # CSC_IDENTITY_AUTO_DISCOVERY=false 明确关闭自动签名探测。
  identity: null
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

linux:
  maintainer: DSH Desktop maintainers <buzhimingLF@users.noreply.github.com>
  category: Development
  synopsis: DeepSeek Harness desktop client
  description: Electron desktop client for DeepSeek Harness with bundled runtime and plugins.
  target:
    - AppImage
    - deb

publish: null
